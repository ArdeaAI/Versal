# G3 FOCUSED ARM (plan Phase 2 gate): diag_g2 (scheduled train + cppn init + self-adaptive rates,
# free growth, Pareto novelty) PLUS the gradient-proposes-structure stack, at the per-candidate
# step budget gate E actually prescribed (2-4k) which halving finally makes affordable:
#
#   1. steps 250 -> 2000 with successive halving [0.125, 0.375, 1.0], keep 0.5: everyone trains
#      250 steps, the best half continues to 750, the best quarter finishes 2000. ~2.5x cheaper
#      than flat-2000 while survivors get the full valley-crossing budget.
#   2. score_candidates = true on the direct trainer: NeST dormant-edge scores ride each trained
#      genome as growth_hints (one extra backward per candidate).
#   3. add_hinted_connection / add_hinted_node / split_node mutation ops: new structure lands
#      where the gradient says signal is missing, and installs are function-preserving (zero
#      fan-out / Net2Wider), so fresh capacity is never culled before it trains.
#
# Flip-to-GO bar (pre-registered, unchanged from gate E): an EVOLVED champion >= 0.95 query at
# small complexity, seeds {0,1,2}. Run:
#
#   uv run run_matrix --config configs/diag_g3_two_spirals.toml --seeds 0,1,2 --cold --tag g3
#
# Derived from configs/diag_g2_two_spirals.toml; deltas marked G3. See that file for the
# rationale comments shared by both arms.

[run]
project = "ardevo"
experiment = "diag_g3_two_spirals"    # G3
clearml = true
machine = "MonadMetal"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
render_async = true
tf32 = false
  [run.duration]
  generations = 1000

[dataset]
source = "Ardea/Icarus-dataset"
n_samples = 400
support_fraction = 0.8

[schedule]
kind = "interleave_rungs"
rungs = [3]
require_all_rungs = true
tasks_per_rung = 20
shuffle = true

[orchestrator]
tasks = 20
accept_metric = "query_accuracy"
accept_threshold = 0.95
floor = 0.35
stall_generations = 60
stall_epsilon = 0.005
max_task_seconds = 600
max_depth = 2
quick_eval_top_k = 5
library_dir = "library"
evolve = ["routed", "direct", "composition"]
decompose = ["output_slices", "input_subsets", "time_windows", "spatial_patches"]
output_slices_n_groups = 2
input_subsets_n_subsets = 2
time_windows_n_windows = 2
spatial_patches_n_patches = 2
decompose_solvability_floor = 0.6
decompose_probe_generations = 6
  [orchestrator.budgets]
  depth0 = 240
  depth1 = 120
  depth2 = 80
  [orchestrator.evolve_budget]
  routed = 0.2
  direct = 0.5
  composition = 0.3
  [orchestrator.routed]
  d_model = 64
  top_k = 2
  max_steps = 4
  train_steps = 200
  lr = 0.003
  weight_decay = 0.0001
  adapter_rank = 4
  load_balance_weight = 0.01
  zero_shot_accept = true
  generation_cost = 10
  distill = true
  distill_usage_floor = 0.1
  distill_max_nodes = 6
  replay_tasks = 8
  replay_every = 4
  include_compositions = true
  exclude_temporal = true
  persist = true
  persist_strict = false
  halting = true
  ponder_epsilon = 0.01
  ponder_cost = 0.001
  edge_bias = true
  [orchestrator.refine]
  budget_k = 24
  depth_max = 0
  metric_epsilon = 0.005
  robustness_epsilon = 0.01
  decay = 0.5
  min_generations = 4
  stall_generations = 8
  retire_superseded = true
  [orchestrator.wall]
  ledger = true
  min_metric = 0.45
  seed_top_k = 1
  [orchestrator.direct]
  pop_size = 64
  elitism = 2
  assess_workers = 12
  halving_stages = [0.125, 0.375, 1.0]  # G3: successive halving (cumulative step fractions). NOTE:
                                        # each stage runs its own warmup+cosine over its step slice
                                        # (warm restarts, SGDR-shape) and Adam state restarts at the
                                        # boundaries; not the single 2000-step anneal, by design.
  halving_keep = 0.5                    # G3: survivors per boundary
    [orchestrator.direct.train]
    kind = "gradient_scheduled"
    steps = 2000                        # G3: the gate-E prescribed valley-crossing budget (was 250)
    lr = 0.01
    writeback = true
    weight_decay = 0.0002
    score_candidates = true             # G3: NeST growth hints from the trained weights

[library]
admission = "archive"
gc = true
min_metric = 0.9
min_robustness = 0.0
per_niche_cap = 2
max_per_signature = 12

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity", "sin", "gaussian"]
default_activation = "tanh"
recurrent = true

[evolution]
loop = "hierarchical"
pop_size = 64
elitism = 1
  [evolution.init]
  kind = "cppn"
  weight_scale = 1.0
  hidden = 16
  density = 0.8
  generator_hidden = 3
  hidden_activations = ["sin", "gaussian", "tanh"]
  [evolution.selection]
  kind = "nsga2"
  parsimony_epsilon = 0.01
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]
  self_adaptive = true
  self_adaptive_learning_rate = 0.1
  self_adaptive_min = 0.001
  self_adaptive_max = 1.0
  # G3: the g2 operator set plus the gradient-guided growth trio (hinted ops degrade to uniform
  # sampling on hint-less genomes, e.g. crossover children; self-adaptive rates tune all of them).
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection", "mutate_activation", "mutate_aggregation", "add_recurrent_connection", "add_library_module", "add_macro_node", "tweak_refine_steps", "add_local_node", "add_local_connection", "add_shared_motif", "remove_connection", "remove_hidden_node", "add_hinted_connection", "add_hinted_node", "split_node"]
  add_rich_node_prob = 0.12
  add_rich_node_fan_in = 4
  add_deep_node_prob = 0.12
  add_deep_node_fan_in = 4
  add_deep_node_fan_out = 2
  add_connection_prob = 0.12
  toggle_connection_prob = 0.05
  mutate_activation_prob = 0.06
  mutate_aggregation_prob = 0.05
  mutate_aggregation_max_fan_in = 4
  add_recurrent_connection_prob = 0.04
  add_library_module_prob = 0.05
  add_macro_node_prob = 0.05
  add_macro_node_max_outputs = 16
  tweak_refine_steps_prob = 0.06
  tweak_refine_steps_max_steps = 6
  add_local_node_prob = 0.1
  add_local_node_fan_in = 4
  add_local_connection_prob = 0.1
  add_local_connection_radius = 1.5
  add_shared_motif_prob = 0.05
  add_shared_motif_copies = 2
  remove_connection_prob = 0.05
  remove_hidden_node_prob = 0.05
  add_hinted_connection_prob = 0.1      # G3
  add_hinted_node_prob = 0.1            # G3
  add_hinted_node_fan_in = 4            # G3
  split_node_prob = 0.05                # G3
  [evolution.train]
  kind = "gradient"
  steps = 40
  lr = 0.03
  writeback = true
  weight_decay = 0.0002
  [evolution.evaluate]
  kind = "hybrid"
  samples = [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]
  batched_samples = "auto"
  [evolution.novelty]
  k = 15
  archive_cap = 256
  probe_rows = 64
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 6
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

  [evolution.composition]
  pop_size = 48
  elitism = 2
  max_inline_depth = 4
  glue_rank = 8
  glue_rank_threshold = 4096
  catalog_width_tolerance = -1
    [evolution.composition.selection]
    kind = "tournament"
    tournament_size = 2
    [evolution.composition.crossover]
    kind = "comp_neat"
    rate = 0.3
    [evolution.composition.mutation]
    operators = ["add_module_node", "switch_ref", "add_comp_edge", "toggle_comp_edge", "perturb_glue"]
    add_module_node_prob = 0.3
    switch_ref_prob = 0.12
    add_comp_edge_prob = 0.15
    toggle_comp_edge_prob = 0.05
    perturb_glue_prob = 0.6
    perturb_glue_sigma = 0.3

  [evolution.modules]
  pop_size = 64
  elitism = 1
  in_ports = 4
  out_ports = 2
  advance_every = 3
  writeback = "champion"
  attribution = "max"
  decay = 0.95
  offspring_discount = 0.9
  seed_fraction = 0.25
  absorb_top_k = 2

[fitness]
components = ["bounded_negative_support_loss", "support_accuracy", "weight_robustness", "hidden_penalty", "complexity_penalty"]
w_bounded_negative_support_loss = 2.0
w_support_accuracy = 1.0
w_weight_robustness = 0.5
w_hidden_penalty = 0.0
w_complexity_penalty = 0.0
objectives = ["support_accuracy", "novelty"]
