# ROUTED-ONLY: the learned routed substrate as the sole evolve strategy, for the A/B against
# configs/orchestrated_ladder.toml (same schedule, same seed, rows align per task stream).
#
# The router is a sparse mixture-of-experts over FROZEN library entries: per-vertex adapters talk
# to a shared d_model bus, a task-conditioned gate picks top_k experts per routing step, and the
# bounded max_steps unroll makes module-to-module pathways (including cycles) real. Routed wins are
# solved-but-not-shelved (Solution.key = None); the router itself persists under <library_dir>/router.
#
# Two variants of this run:
#   SHARED library (as-is):   the router routes over everything the baseline has accumulated
#   COLD start:               point library_dir at a fresh dir (e.g. "library_routed") and run twice;
#                             run 2's routed_zero_shot counter and router_meta.json train_history
#                             (zero_shot_metric vs task index) are the transfer signal
#
#   uv run app --config configs/orchestrated_routed.toml

[run]
project = "ardevo"
experiment = "orchestrated_routed"
clearml = true
machine = "MonadMetal"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"

[dataset]
source = "Ardea/Icarus-dataset"
n_samples = 400
support_fraction = 0.8

[schedule]
kind = "interleave_rungs"
rungs = [1, 2, 3, 4, 5]
tasks_per_rung = 100
shuffle = true

[orchestrator]
tasks = 400
accept_metric = "query_accuracy"
accept_threshold = 0.95
floor = 0.35
stall_generations = 28
stall_epsilon = 0.005
max_depth = 0                 # no decomposition: keep the routed-only experiment clean
quick_eval_top_k = 5
library_dir = "library"       # swap to "library_routed" for the cold-start variant
evolve = ["routed"]
decompose = []
  [orchestrator.budgets]
  depth0 = 240
  [orchestrator.routed]
  d_model = 64
  top_k = 2
  max_steps = 4               # bounded unroll: the no-stuck-loop guarantee (cycles are legal)
  train_steps = 200
  lr = 0.003
  weight_decay = 0.0001
  adapter_rank = 0            # > 0 = rank-bottlenecked adapters (the anti-bypass lever; try 2-4 if
                              # expert-utilization entropy collapses while metrics stay flat)
  load_balance_weight = 0.01
  zero_shot_accept = true     # a zero-shot clear returns at 0 generations: the router's library hit
  generation_cost = 10        # budget charged when per-task training actually runs
  replay_tasks = 8            # in-memory anti-forgetting: replay a recent task every replay_every steps
  replay_every = 4
  include_compositions = true
  exclude_temporal = true     # TIME-axis entries are out of routing scope for the prototype
  persist = true              # router state survives across tasks AND runs under <library_dir>/router
  persist_strict = false      # true = hard-error on config/state mismatch instead of starting fresh
  halting = false             # learned geometric halting: per-step readouts weighted by stop mass,
                              # early exit once every sample has halted (only ever SHORTENS the unroll)
  ponder_epsilon = 0.01
  ponder_cost = 0.001         # loss penalty per expected step, so halting learns to stop early
  edge_bias = false           # factorized expert-to-expert pathway prior (fired experts bias the
                              # next step's gate); keeps growth append-only, unlike a raw V x V matrix

[library]                     # admission still gates what OTHER runs shelve; routed itself never admits
admission = "archive"
min_metric = 0.9
min_robustness = 0.0
per_niche_cap = 2
max_per_signature = 12

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"
recurrent = true

[evolution]                   # the hierarchical loop still hosts the module pool/state machinery the
loop = "hierarchical"         # trial requires; with evolve = ["routed"] its GA never runs a generation
pop_size = 16
elitism = 1
  [evolution.init]
  kind = "minimal"
  weight_scale = 1.0
  [evolution.selection]
  kind = "tournament"
  tournament_size = 3
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]
  operators = ["add_rich_node", "add_connection"]
  add_rich_node_prob = 0.12
  add_rich_node_fan_in = 4
  add_connection_prob = 0.12
  [evolution.train]
  kind = "gradient"
  steps = 40
  lr = 0.03
  writeback = true
  weight_decay = 0.0002
  [evolution.evaluate]
  kind = "hybrid"
  samples = [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 6
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5
  [evolution.composition]
  pop_size = 8
  elitism = 2
  max_inline_depth = 4
  glue_rank = 8
  glue_rank_threshold = 4096
  catalog_width_tolerance = -1
    [evolution.composition.selection]
    kind = "tournament"
    tournament_size = 2
    [evolution.composition.crossover]
    kind = "comp_neat"
    rate = 0.3
    [evolution.composition.mutation]
    operators = ["add_module_node", "switch_ref", "add_comp_edge", "toggle_comp_edge", "perturb_glue"]
    add_module_node_prob = 0.3
    switch_ref_prob = 0.12
    add_comp_edge_prob = 0.15
    toggle_comp_edge_prob = 0.05
    perturb_glue_prob = 0.6
    perturb_glue_sigma = 0.3
  [evolution.modules]
  pop_size = 16
  elitism = 1
  in_ports = 4
  out_ports = 2
  advance_every = 3
  writeback = "champion"
  attribution = "max"
  decay = 0.95
  offspring_discount = 0.9
  seed_fraction = 0.25
  absorb_top_k = 2

[fitness]
components = ["bounded_negative_support_loss", "support_accuracy", "weight_robustness", "hidden_penalty", "complexity_penalty"]
w_bounded_negative_support_loss = 2.0
w_support_accuracy = 1.0
w_weight_robustness = 0.5
w_hidden_penalty = 0.05
w_complexity_penalty = 0.01
