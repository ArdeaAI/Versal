# ONE config, ONE growing topology, the whole Icarus ladder.
#
# A single continuous run that randomly interleaves tasks across rungs and keeps one population alive
# across the switches, so the topology grows to be good at ALL of them. The interface GROWS on demand
# (it is never pre-allocated): inputs live in descriptor-keyed banks that widen, each task grows its
# own output head, and the shared hidden body persists across rung switches. A complexity penalty is
# MANDATORY here so the shared topology cannot grow unbounded.
#
# Every rung in the dataset is differentiable (the INTERACTIVE flag is provenance only), so the same
# gradient inner loop scores all of them. Start with rungs 1-5 (fast, low-dimensional); to span the
# whole 18-rung ladder, set `rungs = "all"` (or extend the list) - nothing else changes.
#
#   uv run app --config configs/continuous_ladder.toml
#   uv run app --config configs/continuous_ladder.toml --resume results/<ts>_continuous

[run]
project = "ardevo"
experiment = "continuous_ladder"
clearml = true
machine = "local"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
  [run.duration]
  generations = 1000          # total generation budget across all task switches (a continuous run)

[dataset]
source = "Ardea/Icarus-dataset"
n_samples = 1000
support_fraction = 0.8

[schedule]
# Which rung the population faces next, and for how long. options for kind:
#   "random"           (param: avoid_repeat) -- uniform random next task, optionally never twice running
#   "round_robin"      -- walk the pool in order
#   "interleave_rungs" -- one task per rung per cycle (round-robin across rungs)
kind = "interleave_rungs"
avoid_repeat = true
generations_per_task = 40   # generations on one task before switching to the next
checkpoint_every = 100      # write a gen_<NNNNNN>/ checkpoint (model, stats, net, speciation) this often
rungs = "all"     # interleaved rungs: a list like [1,2,3,4,5], or "all" for the 18-rung ladder. Rungs
                  # too heavy for the HF/arrow loader (some NB360 modalities overflow its 2 GB chunk
                  # limit) are skipped with a warning rather than crashing the run.
tasks_per_rung = 100        # cap on tasks drawn per rung (capped at what the repo actually has)
shuffle = true              # seeded shuffle of which tasks are drawn / their pool order

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"

[evolution]
pop_size = 48
elitism = 2
  [evolution.init]
  kind = "minimal"
  weight_scale = 1.0
  [evolution.selection]
  kind = "tournament"
  tournament_size = 3
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]
  # Geometry-biased operators (add_local_node/add_local_connection/add_shared_motif) read the axis
  # coordinates the substrate stamps on input nodes and grow LOCAL receptive fields / repeated motifs;
  # they no-op where coordinates are absent, leaving the non-local operators to grow generic structure.
  operators = ["add_local_node", "add_shared_motif", "add_rich_node", "add_deep_node", "add_local_connection", "add_connection", "toggle_connection"]
  add_local_node_prob = 0.16
  add_local_node_fan_in = 6
  add_shared_motif_prob = 0.06
  add_shared_motif_copies = 2
  add_rich_node_prob = 0.10
  add_rich_node_fan_in = 6
  add_deep_node_prob = 0.12
  add_deep_node_fan_in = 6
  add_deep_node_fan_out = 3
  add_local_connection_prob = 0.14
  add_local_connection_radius = 1.5
  add_connection_prob = 0.10
  toggle_connection_prob = 0.05
  [evolution.train]
  kind = "gradient"
  steps = 120
  lr = 0.03
  writeback = true
  weight_decay = 0.0002       # regularize for generalization on the data-rich rungs
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 12
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

# A complexity/hidden penalty is REQUIRED here (the trial refuses to run without one) so the shared
# body, reused across every rung, cannot grow unbounded. Use `hidden_penalty` (bounds hidden-node
# count) NOT `complexity_penalty` (total edges): with high-D I/O the dense readout is hundreds of edges,
# so an edge penalty swamps the fitting signal and punishes all growth.
#
# negative_support_loss is the PRIMARY driver: it is value-type-correct for every rung (MSE for the
# continuous pole rungs, BCE for binary, CE for categorical), so it rewards fitting where accuracy is
# degenerate (regression accuracy is a within-tolerance fraction, useful to read but a poor gradient).
# query terms are omitted: held-out loss is anti-generalization on parity, and weight_decay (in the
# train stage) is what delivers generalization on the data-rich rungs.
[fitness]
components = ["negative_support_loss", "support_accuracy", "hidden_penalty", "complexity_penalty"]
w_negative_support_loss = 2.0
w_support_accuracy = 1.0
w_hidden_penalty = 0.05
w_complexity_penalty = 0.01
