# THE ORCHESTRATED LADDER: the recursive hierarchical orchestrated evolver on interleaved rungs.
#
# Each scheduled task goes through the orchestrator's escalation ladder:
#   1 LOOKUP     query the library by structural I/O signature; accept a stored solution that still
#                clears the bar (a solved task stays solved: the anti-forgetting property)
#   2 EVOLVE     hierarchical loop: per-task COMPOSITIONS (glue over reusable parts) co-evolve with
#                a SHARED live module population; fitness flows down as attribution
#   3 DECOMPOSE  on a stall, split the task into valid subtasks, RECURSE on each, admit the parts,
#                then re-evolve the parent seeded with the port-wired composition over them
#   4 ADMIT      winners persist into the library (live module refs are snapshotted frozen), so the
#                library accumulates mini-models (level 1), compositions (level 2), and compositions
#                of compositions (level 3+) across tasks AND across runs
#
#   uv run app --config configs/orchestrated_ladder.toml
#   uv run app --config configs/orchestrated_ladder.toml --resume results/<ts>_orchestrated

[run]
project = "ardevo"
experiment = "phase6_gate"
clearml = false
machine = "MonadMetal"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
  [run.duration]
  generations = 1000          # informational; the orchestrated run is bounded by [orchestrator] tasks

[dataset]
source = "Ardea/Icarus-dataset"
n_samples = 60
support_fraction = 0.8

[schedule]                    # GATE: rung 3 (two_spirals) only, a handful of fresh instances
kind = "interleave_rungs"
rungs = [3]
tasks_per_rung = 4
shuffle = false

[orchestrator]
tasks = 3                      # 3 two_spirals instances: enough to read the metric ceiling
accept_metric = "query_accuracy"
accept_threshold = 0.95
floor = 0.35
stall_generations = 28
stall_epsilon = 0.005
max_depth = 0                 # GATE: no decompose, isolate the A+B lever
quick_eval_top_k = 5
library_dir = "_phase6_gate_library"   # scratch: never touch the real library
evolve = ["direct"]           # GATE: direct only (where two_spirals is solved); isolate the lever
decompose = []
  [orchestrator.budgets]
  depth0 = 140
  [orchestrator.evolve_budget]
  direct = 1.0
  [orchestrator.direct]
  pop_size = 48
  elitism = 2
    [orchestrator.direct.train]
    kind = "gradient_refine"
    steps = 80
    lr = 0.03
    writeback = true
    weight_decay = 0.0002

[library]                     # admission policy: what earns a place on the shelf
admission = "archive"         # open-ended QD archive: keep BEHAVIORALLY DIVERSE stepping stones, not
                              # just the top-k by metric ("default" = flat cap; "accept_all" = legacy)
min_metric = 0.9              # quality floor on the accept metric
min_robustness = 0.0          # weight-robustness floor (raise once the library is healthy)
per_niche_cap = 2             # max entries per (io shape, behavior niche): distinct KINDS of solution
                              # coexist (small/deep, recurrent/refining, gated, macro) for recombination
max_per_signature = 12        # total live entries per io shape across all niches; the weakest is
                              # tombstoned (never deleted) when full, so existing refs keep assembling

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"
recurrent = true              # permits recurrent genes (inert under the flat decode; the stepped
                              # substrate uses them on TIME-axis subtask evolution)

[evolution]
loop = "hierarchical"
pop_size = 64                 # module population fallback (overridden by [evolution.modules].pop_size)
elitism = 1
  [evolution.init]
  kind = "minimal"
  weight_scale = 1.0
  [evolution.selection]
  kind = "tournament"
  tournament_size = 3
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]        # the MODULE population's operators (the proven phase-1 recipe plus
                              # the new primitives: product gating, recurrence, and library reuse:
                              # add_library_module inlines a found network as evolvable structure,
                              # add_macro_node embeds one as a single FROZEN unit, LSTM-cell style)
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection", "mutate_activation", "mutate_aggregation", "add_recurrent_connection", "enable_refinement", "add_library_module", "add_macro_node", "tweak_refine_steps", "add_local_node", "add_local_connection", "add_shared_motif"]
  add_rich_node_prob = 0.12
  add_rich_node_fan_in = 4
  add_deep_node_prob = 0.12
  add_deep_node_fan_in = 4
  add_deep_node_fan_out = 2
  add_connection_prob = 0.12
  toggle_connection_prob = 0.05
  mutate_activation_prob = 0.06
  mutate_aggregation_prob = 0.05
  mutate_aggregation_max_fan_in = 4
  add_recurrent_connection_prob = 0.04
  enable_refinement_prob = 0.03   # phase 6: ONE atomic recurrent-self-loop + refine_steps>=2 mutation
                                  # that breaks the TRM catch-22 (the two halves are inert apart, and
                                  # their independent co-occurrence ~0.0024 never clears the stall window)
  add_library_module_prob = 0.05
  add_macro_node_prob = 0.05
  add_macro_node_max_outputs = 16
  tweak_refine_steps_prob = 0.06   # TRM lever: nudge per-genome refinement depth (paired with recurrence)
  tweak_refine_steps_max_steps = 6
  # Geometry operators: no-ops without coordinates (the flat/module path), but on grid tasks the
  # direct strategy stamps axis coordinates, so these grow LOCAL receptive fields and repeated
  # motifs (a structural convolution prior, untied weights) -- the lever for the high-dim image wall.
  add_local_node_prob = 0.1
  add_local_node_fan_in = 4
  add_local_connection_prob = 0.1
  add_local_connection_radius = 1.5
  add_shared_motif_prob = 0.05
  add_shared_motif_copies = 2
  [evolution.train]           # trains assembled compositions: glue + unfrozen live module copies
  kind = "gradient"
  steps = 40
  lr = 0.03
  writeback = true            # flat-loop semantics; the hierarchical loop routes writeback itself
  weight_decay = 0.0002
  [evolution.evaluate]        # hybrid = trained metrics PLUS weight-robustness (library admission currency)
  kind = "hybrid"
  samples = [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]
  [evolution.speciation]      # module species are the blueprint targets the compositions reference
  kind = "neat"
  threshold = 1.5
  target_species = 6
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

  [evolution.novelty]         # phase 6: functional novelty / quality-diversity SELECTION pressure.
                              # Selection blends true fitness with the sparseness of a genome's
                              # FUNCTIONAL behavior (its outputs on the support set) against a per-
                              # evolve archive, so the search diverges through stepping stones instead
                              # of collapsing onto the deceptive optimum (two_spirals). Elitism and the
                              # champion still use TRUE fitness. enabled=false keeps the flat path exact.
  enabled = true
  weight = 0.5                # 0 = pure fitness, 1 = pure novelty
  k = 10                      # k-nearest behaviors for the sparseness measure
  archive_max = 200           # bounded behavior archive (oldest evicts first)
  add_prob = 0.1              # chance to also archive a random individual each generation
  descriptor_dim = 64         # cap on the functional descriptor length (bounded for image widths)

  [evolution.composition]     # the per-task composition population (level 2+)
  pop_size = 48
  elitism = 2
  max_inline_depth = 4
  glue_rank = 8               # NEW glue factorizes to rank 8 when in*out exceeds the threshold
  glue_rank_threshold = 4096  # (a width-784 dense edge is 614k floats; rank 8 is 12.5k)
  catalog_width_tolerance = -1  # -1 = expose every library entry to comp mutations (glue adapts)
    [evolution.composition.selection]
    kind = "tournament"
    tournament_size = 2
    [evolution.composition.crossover]
    kind = "comp_neat"
    rate = 0.3
    [evolution.composition.mutation]
    operators = ["add_module_node", "switch_ref", "add_comp_edge", "toggle_comp_edge", "perturb_glue"]
    add_module_node_prob = 0.3
    switch_ref_prob = 0.12
    add_comp_edge_prob = 0.15
    toggle_comp_edge_prob = 0.05
    perturb_glue_prob = 0.6
    perturb_glue_sigma = 0.3

  [evolution.modules]         # the shared live module population (level 1)
  pop_size = 64
  elitism = 1
  in_ports = 4
  out_ports = 2
  advance_every = 3           # module generations per composition generation
  writeback = "champion"      # only the best composition writes module weights back
  attribution = "max"         # a module is as good as the BEST composition using it
  decay = 0.95
  offspring_discount = 0.9
  seed_fraction = 0.25        # fraction of the module pool grafted from the library at run start
  absorb_top_k = 2            # at each lookup miss, graft up to this many NEW library entries over
                              # the worst non-champions: found structures join the soup mid-run

[fitness]
# Phase 5: bounded loss (0,1] instead of raw (-inf,0] so it no longer swamps accuracy and robustness;
# robustness weight raised because it is the library admission currency and the cross-task transfer
# signal. All components now live on a comparable scale, so selection actually balances them.
components = ["bounded_negative_support_loss", "support_accuracy", "weight_robustness", "hidden_penalty", "complexity_penalty"]
w_bounded_negative_support_loss = 2.0
w_support_accuracy = 1.0
w_weight_robustness = 0.5
w_hidden_penalty = 0.05
w_complexity_penalty = 0.01
