extends = "canary.toml"

# Deep capability test for one task family. Change only `rungs` to retarget it; the shared library
# lets repeated assaults compound. Two hundred ten-minute tasks cap the run at about 33 hours.

[run]
experiment = "orchestrated_overmind_brute"

[dataset]
n_samples = 400

[schedule]
rungs = [18]
tasks_per_rung = 20

[orchestrator]
tasks = 20
max_task_seconds = 540
max_total_task_seconds = 620

  [orchestrator.budgets]
  depth0 = 400
  depth1 = 360
  depth2 = 320
  depth3 = 240
  depth4 = 160
  depth5 = 80
  depth6 = 40
  depth7 = 20
  depth8 = 10
