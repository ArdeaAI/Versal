extends = "canary.toml"

# Deep capability test for one task family. Change only `rungs` to retarget it; the shared library
# lets repeated assaults compound. Twenty two-hour tasks cap the run at about 40 hours.

[run]
experiment = "orchestrated_overmind_brute"

[dataset]
n_samples = 400

[schedule]
rungs = [18]
tasks_per_rung = 200

[orchestrator]
tasks = 200
max_task_seconds = 240
max_total_task_seconds = 480

  [orchestrator.budgets]
  depth0 = 200
  depth1 = 100
  depth2 = 60
  depth3 = 50
  depth4 = 40
  depth5 = 30
  depth6 = 20
  depth7 = 10
  depth8 = 10
