# Rung 3: two-spirals. A real generalization benchmark: 194 train / 192 held-out test points, a 2D
# continuous, non-linearly-separable boundary. Here query accuracy IS meaningful generalization and is
# the goal. Verified result: this config grows from 0 hidden nodes to ~23 and reaches query 1.000
# (perfect held-out generalization) by ~generation 100. The keys: DEPTH (add_deep_node; a single hidden
# layer tops out ~0.6), enough accumulated training (high steps + free growth), and weight_decay to make
# the fit GENERALIZE rather than memorize. This is the slow rung (~10-15 min). Run:
#   uv run app --config configs/rung3_two_spirals.toml

[run]
project = "ardevo"
experiment = "rung3_two_spirals"
clearml = false
machine = "local"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
  [run.duration]
  generations = 150         # solves (query 1.0) by ~gen 100; growth is unbounded here, so stop once it plateaus

[dataset]
source = "Ardea/Icarus-dataset"
rung = 3
n_samples = 1000
support_fraction = 0.8     # fixed-split task; support_fraction is ignored (native 194/192 split)

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"

[evolution]
pop_size = 32
elitism = 2
  [evolution.init]
  kind = "minimal"
  [evolution.selection]
  kind = "tournament"
  tournament_size = 3
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]
  # depth-heavy: two-spirals needs hidden -> hidden structure
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection"]
  add_rich_node_prob = 0.15
  add_rich_node_fan_in = 8
  add_deep_node_prob = 0.25
  add_deep_node_fan_in = 8
  add_deep_node_fan_out = 4
  add_connection_prob = 0.18
  toggle_connection_prob = 0.05
  [evolution.train]
  kind = "gradient"
  steps = 200                # two-spirals is training-limited; needs many accumulated steps
  lr = 0.03
  writeback = true
  weight_decay = 0.0002      # L2 regularization: makes the fit GENERALIZE (closes the support->query gap)
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 12
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

# query (held-out generalization) is the goal; support bootstraps early growth. No complexity penalty
# here: two-spirals needs to grow to ~20+ hidden nodes, and weight_decay (not a node budget) is what
# delivers generalization. Add a small w_complexity_penalty if you want a more minimal solving net.
[fitness]
components = ["support_accuracy", "query_accuracy", "complexity_penalty"]
w_support_accuracy = 0.3
w_query_accuracy = 0.7
w_complexity_penalty = 0.02
