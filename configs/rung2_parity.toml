# Rung 2: parity. The default task parity.n4.b0 is the canonical anti-generalization function: its
# whole pool is 16 examples and fitting the 13-point support set tells you NOTHING about the 3 held-out
# points (a hand-built net that fits support perfectly still scores ~0.0-0.33 on query). So the
# meaningful goal here is FITTING THE FUNCTION: drive support_accuracy to 1.0 with a grown, minimal
# topology. query_accuracy on this slice is noise and is expected to stay ~0.33-0.67; do not chase it.
# (Larger parity tasks in this rung, e.g. parity.n6.b0 with 51/13, give a less degenerate query split.)
# Run: uv run app --config configs/rung2_parity.toml

[run]
project = "ardevo"
experiment = "rung2_parity"
clearml = false
machine = "local"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
  [run.duration]
  generations = 200

[dataset]
source = "Ardea/Icarus-dataset"
rung = 2
n_samples = 1000          # the parity.n4 pool caps at 16 regardless
support_fraction = 0.8

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"

[evolution]
pop_size = 64
elitism = 2
  [evolution.init]
  kind = "minimal"
  [evolution.selection]
  kind = "tournament"
  tournament_size = 3
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection"]
  add_rich_node_prob = 0.14
  add_rich_node_fan_in = 6
  add_deep_node_prob = 0.12
  add_deep_node_fan_in = 6
  add_deep_node_fan_out = 3
  add_connection_prob = 0.18
  toggle_connection_prob = 0.08
  [evolution.train]
  kind = "gradient"
  steps = 120
  lr = 0.05
  writeback = true
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 12
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

# Drive function-fit (support); a modest complexity penalty keeps the solving topology minimal.
[fitness]
components = ["support_accuracy", "complexity_penalty"]
w_support_accuracy = 1.0
w_complexity_penalty = 0.01
