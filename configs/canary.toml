# Complete local methodology: one task from every rung with every search, reuse, and
# decomposition mechanism enabled. Intended for an M4 Max and roughly a 1-2 hour run.

[run]
project = "versal"
experiment = "orchestrated_overmind_canary"
clearml = true
# Keep Rich's transient progress footer local. Python logs, metrics, and artifacts still report.
clearml_capture_streams = false
machine = "MonadMetal"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/versal.git"
render_async = true
tf32 = false
live_status = true

  [run.duration]
  generations = 1000

[dataset]
source = "Ardea/Icarus-dataset"
n_samples = 128
support_fraction = 0.8
min_fixed_query_samples = 32

[schedule]
kind = "interleave_rungs"
rungs = "all"
require_all_rungs = true
tasks_per_rung = 2
shuffle = true

[orchestrator]
tasks = 36
# Search uses dense support feedback, admission respects task-level semantics, and reporting is held out.
search_metric = "support_accuracy"
accept_metric = "support_task_appropriate"
report_metric = "query_task_appropriate"
blind_query = true
accept_threshold = 0.95
floor = 0.35
stall_generations = 28
stall_epsilon = 0.005
max_task_seconds = 900
max_total_task_seconds = 900
max_depth = 8
quick_eval_top_k = 5
library_dir = "library"
# Oversized dense initializations decompose before trying a flat network.
decompose_first_above = 2000000
evolve = ["routed", "grammar", "direct", "composition"] ## "field"
decompose = ["output_slices", "input_subsets", "time_windows", "spatial_patches"]
output_slices_n_groups = 2
output_slices_max_output_features = 1024
input_subsets_n_subsets = 2
time_windows_n_windows = 2
spatial_patches_n_patches = 2
decompose_solvability_floor = 0.6
decompose_probe_generations = 6
decompose_probe_seconds = 30
decompose_leaf_cap = 64

  # A support-perfect payload is a provisional solution until it can relearn from reduced support.
  # The omitted support examples are the only validation labels; the real query remains blind.
  [orchestrator.cross_validation]
  enabled = true
  max_folds = 5
  min_folds = 2
  pass_fraction = 0.5
  reserve_fraction = 0.15
  reserve_min_seconds = 5
  reserve_max_seconds = 60

  # Deeper subproblems receive progressively smaller evolutionary searches.
  [orchestrator.budgets]
  depth0 = 240
  depth1 = 120
  depth2 = 80
  depth3 = 40
  depth4 = 20
  depth5 = 10
  depth6 = 5
  depth7 = 5
  depth8 = 5

  [orchestrator.evolve_budget]
  routed = 0.15
  grammar = 0.15
  field = 0.25
  direct = 0.30
  composition = 0.15

  [orchestrator.field]
  train_sites = 4096
  audit_sites = 16384
  verify_top_k = 5
  verify_chunk_size = 32768
  pop_size = 64
  elitism = 2
  assess_workers = 0

    [orchestrator.field.train]
    kind = "gradient_scheduled"
    steps = 20
    lr = 0.01
    writeback = true
    weight_decay = 0.0001

    [orchestrator.field.evaluate]
    kind = "standard"

  # The router selects frozen library experts, then distills successful pathways into reusable compositions.
  [orchestrator.routed]
  d_model = 64
  top_k = 2
  max_steps = 4
  train_steps = 200
  lr = 0.003
  weight_decay = 0.0001
  adapter_rank = 4
  load_balance_weight = 0.01
  zero_shot_accept = true
  generation_cost = 10
  distill = true
  distill_usage_floor = 0.1
  distill_max_nodes = 6
  replay_tasks = 8
  replay_every = 4
  include_compositions = true
  exclude_temporal = true
  persist = true
  persist_strict = false
  halting = true
  ponder_epsilon = 0.01
  ponder_cost = 0.001
  edge_bias = true

    # Dormant experts leave routing after 24 routed tasks, then leave the library after 48 unused tasks.
    [orchestrator.routed.lifecycle]
    enabled = true
    route_patience_tasks = 24
    library_patience_tasks = 48
    activity_floor = 0.01
    traffic_decay = 0.95

  # Grammar search recombines structures independently rediscovered across multiple lineages.
  [orchestrator.grammar]
  max_productions = 12
  candidates_per_production = 3
  mutation_steps = 2
  module_sizes = [3, 4]
  composition_sizes = [2, 3, 4]
  min_lineage_support = 2
  per_entry_cap = 5000

  # Direct search grows task-shaped networks and trains their weights with a warmup/cosine schedule.
  [orchestrator.direct]
  pop_size = 64
  elitism = 2
  assess_workers = "auto"
  max_flat_outputs = 4096
  max_init_genes = 2000000
  structured_grid = true

    [orchestrator.direct.train]
    kind = "gradient_scheduled"
    steps = 160
    lr = 0.03
    writeback = true
    weight_decay = 0.0002
    compute_policy_path = "results/compute_policy.json"

  # A library hit spends a bounded search looking for a simpler or more capable replacement.
  [orchestrator.refine]
  mode = "always"
  budget_k = 24
  depth_max = 0
  metric_epsilon = 0.005
  robustness_epsilon = 0.01
  decay = 0.5
  min_generations = 4
  stall_generations = 8
  retire_superseded = true
  deduplicate_topologies = true
  topology_retry_limit = 8

  # Below-threshold champions become warm starts instead of being discarded between related tasks.
  [orchestrator.wall]
  ledger = true
  min_metric = 0.45
  min_gain_over_baseline = 0.0
  seed_top_k = 1

# The quality-diversity archive keeps distinct useful behaviors while bounding each I/O signature.
[library]
admission = "archive"
gc = true
min_metric = 0.9
min_robustness = 0.0
per_niche_cap = 2
max_per_signature = 12

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity", "sin", "gaussian"]
default_activation = "tanh"
recurrent = true

[evolution]
loop = "hierarchical"
pop_size = 64
elitism = 1

  # A small coordinate network generates sparse, diverse initial connectivity for every genome.
  [evolution.init]
  kind = "cppn"
  weight_scale = 1.0
  hidden = 4
  density = 0.3
  generator_hidden = 3

  [evolution.selection]
  kind = "nsga2"
  parsimony_epsilon = 0.01

  [evolution.crossover]
  kind = "neat"
  rate = 0.2

  # Mutation rates are inherited and perturbed so each lineage can adapt its structural search pressure.
  [evolution.mutation]
  self_adaptive = true
  self_adaptive_learning_rate = 0.1
  self_adaptive_min = 0.001
  self_adaptive_max = 1.0
  operators = [
    "add_rich_node",
    "add_deep_node",
    "add_connection",
    "toggle_connection",
    "mutate_activation",
    "mutate_aggregation",
    "add_recurrent_connection",
    "add_macro_node",
    "tweak_refine_steps",
    "add_local_node",
    "add_local_connection",
    "add_shared_motif",
    "untie_motif_weights",
    "remove_connection",
    "remove_hidden_node",
    "prune_and_regrow",
  ]
  add_rich_node_prob = 0.12
  add_rich_node_fan_in = 4
  add_deep_node_prob = 0.12
  add_deep_node_fan_in = 4
  add_deep_node_fan_out = 2
  add_connection_prob = 0.12
  toggle_connection_prob = 0.05
  mutate_activation_prob = 0.06
  mutate_aggregation_prob = 0.05
  mutate_aggregation_max_fan_in = 4
  add_recurrent_connection_prob = 0.04
  add_macro_node_prob = 0.05
  add_macro_node_max_outputs = 16
  tweak_refine_steps_prob = 0.06
  tweak_refine_steps_max_steps = 6
  add_local_node_prob = 0.1
  add_local_node_fan_in = 4
  add_local_connection_prob = 0.1
  add_local_connection_radius = 1.5
  add_shared_motif_prob = 0.05
  add_shared_motif_copies = 2
  add_shared_motif_tied = true
  untie_motif_weights_prob = 0.02
  remove_connection_prob = 0.05
  remove_hidden_node_prob = 0.05
  prune_and_regrow_prob = 0.1
  prune_and_regrow_fraction = 0.05

  # Composition training tunes glue and live module copies, then writes learned weights back.
  [evolution.train]
  kind = "gradient"
  steps = 40
  lr = 0.03
  writeback = true
  weight_decay = 0.0002

  [evolution.evaluate]
  kind = "hybrid"
  samples = [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]
  batched_samples = "auto"

  # Novelty rewards behaviors unlike the current population and its bounded task-local archive.
  [evolution.novelty]
  k = 15
  archive_cap = 256
  probe_rows = 64

  # Species protect structurally distinct modules while the threshold tracks a target population count.
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 6
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

  # Compositions evolve graphs of reusable modules connected by trainable low-rank glue.
  [evolution.composition]
  pop_size = 48
  elitism = 2
  max_inline_depth = 8
  glue_rank = 8
  glue_rank_threshold = 4096
  glue_storage = "f32"
  max_initial_glue_values = 0
  catalog_width_tolerance = -1
  version = 1

    [evolution.composition.selection]
    kind = "tournament"
    tournament_size = 2

    [evolution.composition.crossover]
    kind = "comp_neat"
    rate = 0.3

    [evolution.composition.mutation]
    operators = ["add_module_node", "switch_ref", "add_comp_edge", "toggle_comp_edge", "perturb_glue"]
    add_module_node_prob = 0.3
    switch_ref_prob = 0.12
    add_comp_edge_prob = 0.15
    toggle_comp_edge_prob = 0.05
    perturb_glue_prob = 0.6
    perturb_glue_sigma = 0.3

  # The shared module population absorbs reusable library structures and receives champion-only credit.
  [evolution.modules]
  pop_size = 64
  elitism = 1
  in_ports = 4
  out_ports = 2
  advance_every = 3
  writeback = "champion"
  attribution = "max"
  decay = 0.95
  offspring_discount = 0.9
  seed_fraction = 0.25
  absorb_top_k = 2

# Scalar fitness trains champions; the objective vector drives Pareto selection.
[fitness]
components = ["bounded_negative_support_loss", "support_accuracy", "weight_robustness", "hidden_penalty", "complexity_penalty"]
w_bounded_negative_support_loss = 2.0
w_support_accuracy = 1.0
w_weight_robustness = 0.5
w_hidden_penalty = 0.05
w_complexity_penalty = 0.01
objectives = ["support_accuracy", "novelty", "weight_robustness", "connection_cost"]
