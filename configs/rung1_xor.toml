# Rung 1: XOR. The full truth table is 4 points (support == query), so query == support: solving it
# means 100% on all 4. A minimal 2->1 net caps at 75%, so a win requires growing >=1 hidden node.
# Run: uv run app --config configs/rung1_xor.toml   (see config.toml for what every field means)

[run]
project = "ardevo"
experiment = "rung1_xor"
clearml = false
machine = "local"
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
  [run.duration]
  generations = 120

[dataset]
source = "Ardea/Icarus-dataset"
rung = 1
n_samples = 16
support_fraction = 0.8

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"

[evolution]
pop_size = 48
elitism = 2
  [evolution.init]
  kind = "minimal"
  [evolution.selection]
  kind = "tournament"
  tournament_size = 3
  [evolution.crossover]
  kind = "neat"
  rate = 0.2
  [evolution.mutation]
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection"]
  add_rich_node_prob = 0.12
  add_rich_node_fan_in = 4
  add_deep_node_prob = 0.10
  add_deep_node_fan_in = 4
  add_deep_node_fan_out = 2
  add_connection_prob = 0.2
  toggle_connection_prob = 0.08
  [evolution.train]
  kind = "gradient"
  steps = 80
  lr = 0.05
  writeback = true
  [evolution.speciation]
  kind = "neat"
  threshold = 1.5
  target_species = 10
  threshold_adjust = 0.3
  min_threshold = 0.3
  c_excess = 1.0
  c_disjoint = 1.0
  c_weight = 0.5

# Support == query here, so both terms reward solving the function.
[fitness]
components = ["support_accuracy", "query_accuracy", "complexity_penalty"]
w_support_accuracy = 0.5
w_query_accuracy = 0.5
w_complexity_penalty = 0.02
