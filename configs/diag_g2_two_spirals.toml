# G2 FOCUSED ARM: the diag_g1 two-spirals probe (20 cold assaults on rung-3, Pareto + novelty)
# with the full gate-E fork stack layered on top, so the ONLY differences from diag_g1 are the
# three levers that the gate-E analysis funded:
#
#   1. gradient_scheduled on the direct path     warmup + cosine that defeats the training-time valley
#   2. cppn generative init, sin/gaussian-seeded  plants periodic + radial primitives from gen 0
#   3. self-adaptive per-genome mutation rates    ES perturb-and-inherit; rates adapt to the task
#
# WHY these three, here: gate E found two-spirals is a REPRESENTATION wall (zero sin nodes ever
# evolved; max_sample_accuracy at chance in every G0/G1 arm) gated by TRAINABILITY, not search.
# (1) is the validated valley fix (a seeded all-sin topology survives as champion at 0.651 instead
# of dying at 0.604 under fixed lr). (2) seeds the periodic structure evolution never discovered on
# its own, straight into the population. (3) lets the operator mix retune itself for a task where the
# hand-set rates plateaued. This is the config to run the gate-E flip-to-GO probe from.
#
#   uv run app --config configs/diag_g2_two_spirals.toml

[run]
project = "ardevo"
experiment = "diag_g2_two_spirals"
clearml = true
machine = "MonadMetal"        # also picks the population-batched compute device: MonadMetal -> mps,
                              # LatticeCUDA -> cuda ([run] compute = "cpu"|"mps"|"cuda" overrides)
seed = 0
log_level = "INFO"
output_uri = false
repo = "https://github.com/ArdeaAI/ardevo.git"
render_async = true           # admission/overmind PNGs draw on a background thread instead of
                              # blocking the run loop (flushed before uploads, GC, and run end)
tf32 = false                  # opt-in TF32 CUDA matmuls: faster on Ampere+, changes numerics
  [run.duration]
  generations = 1000          # informational; the orchestrated run is bounded by [orchestrator] tasks

[dataset]
source = "Ardea/Icarus-dataset"
n_samples = 400
support_fraction = 0.8

[schedule]
kind = "interleave_rungs"
rungs = [3]                   # two-spirals only: paired against the G0/G1 runs
require_all_rungs = true      # a rung that fails to LOAD aborts the run loudly (probe: uv run rung_doctor)
tasks_per_rung = 20
shuffle = true

[orchestrator]
tasks = 20                     # 20 assaults, matching diag_g0/g1
accept_metric = "query_accuracy"   # falls back to support_accuracy on degenerate query-less tasks
accept_threshold = 0.95
floor = 0.35                  # below this at half budget = early stall
stall_generations = 60        # RAISED from 28: the validated two-spirals solve accumulates depth
                              # (0 -> ~23 hidden) in plateau-then-jump steps over ~100 generations, so a
                              # 28-gen flatline window aborts a climb mid-growth before the next jump and
                              # leaves the depth0=240 budget unspent. 60 gives a growth plateau room.
stall_epsilon = 0.005
max_depth = 2                 # recursion cap for decomposition
quick_eval_top_k = 5
library_dir = "library"       # persistent across runs: delete it to start the search space cold
evolve = ["routed", "direct", "composition"]   # routed goes FIRST: a zero-shot clear costs 0 generations
                                     # and a miss charges only generation_cost before direct takes over
                                     # (config order, first success wins, unspent budget rolls on).
decompose = ["output_slices", "input_subsets", "time_windows", "spatial_patches"]
output_slices_n_groups = 2
input_subsets_n_subsets = 2
time_windows_n_windows = 2
spatial_patches_n_patches = 2    # grid->grid: tile a band of the spatial axis (the ARC-portable split)
decompose_solvability_floor = 0.6   # skip a decompose op whose probed subtasks cannot fit support this far
decompose_probe_generations = 6     # short evolve to probe each subtask before committing the budget
  [orchestrator.budgets]      # evolve generations per recursion depth (shared across strategies)
  depth0 = 240
  depth1 = 120
  depth2 = 80
  [orchestrator.evolve_budget]  # relative budget shares within one depth allocation (direct leads;
  routed = 0.2                  # routed's slice is small because it bills generation_cost, not real gens)
  direct = 0.5
  composition = 0.3
  [orchestrator.routed]       # the learned routed substrate: a sparse MoE over FROZEN library entries.
                              # Router training stays on CPU deliberately: d_model 64 kernels are far
                              # below the measured GPU break-even (T4/T5 showed even the pop-64 batch
                              # program loses to CPU at these sizes), so a device knob here would only
                              # invite a slower configuration.
  d_model = 64                # the shared bus width; growth is an append, never a resize
  top_k = 2
  max_steps = 4               # bounded unroll: the no-stuck-loop guarantee (cycles are legal)
  train_steps = 200
  lr = 0.003
  weight_decay = 0.0001
  adapter_rank = 4            # > 0 = rank-bottlenecked adapters, forcing routing to earn its keep
                              # (the anti-bypass lever; raise if expert utilization collapses)
  load_balance_weight = 0.01
  zero_shot_accept = true     # a zero-shot clear returns at 0 generations: the router's library hit
  generation_cost = 10        # budget charged when per-task training actually runs
  distill = true              # THE DSL CONTRACT: a win must distill into a verified composition to
                              # count (admitted as a new vertex); adapter-only wins report as misses
                              # and escalate. false = solved-but-not-shelved, for A/B only
  distill_usage_floor = 0.1   # mean gate weight an expert needs at some step to make the pathway
  distill_max_nodes = 6       # size cap on the distilled composition
  replay_tasks = 8            # in-memory anti-forgetting: replay a recent task every replay_every steps
  replay_every = 4
  include_compositions = true
  exclude_temporal = true     # TIME-axis entries are out of routing scope for the prototype
  persist = true              # router state survives across tasks AND runs under <library_dir>/router
  persist_strict = false      # true = hard-error on config/state mismatch instead of starting fresh
  halting = true              # Stage C: ACT-style geometric halting (only ever SHORTENS the unroll)
  ponder_epsilon = 0.01
  ponder_cost = 0.001         # loss penalty per expected step, so halting learns to stop early
  edge_bias = true            # Stage C: factorized expert-to-expert pathway prior (fired experts
                              # bias the next step's gate); append-only, unlike a raw V x V matrix
  [orchestrator.refine]       # LEARN MODE: on a library hit, spend up to budget_k generations seeded
                              # from the stored solution trying to beat it (lexicographic: metric,
                              # then robustness, then LOWER complexity), admit only strict wins, and
                              # fall back to the known topology otherwise. budget_k = 0 is LIVE mode:
                              # hits stay zero-cost, byte-identical to the pre-refine behavior.
  budget_k = 24               # 10 percent of depth0; a per-hit CAP, not a fixed cost (stall stops early)
  depth_max = 0               # refine top-level hits only; raising it refines sub-solve hits too, whose
                              # improvements admit UNCONDITIONALLY via the dependency rail (unbounded)
  metric_epsilon = 0.005
  robustness_epsilon = 0.01
  decay = 0.5                 # effective-K multiplier per consecutive no-gain (24->12->6->skip). The cooldown
                              # rides the LINEAGE: a capability gain (metric/robustness) recharges it, a
                              # compression-only gain spends it, so one capability epoch funds a few polish
                              # passes and then the family sleeps (DreamCoder compress-then-stop)
  min_generations = 4         # decayed budgets below this skip refinement entirely
  stall_generations = 8       # refine-local flatline window (the global 28 would exceed typical budgets)
  retire_superseded = true    # tombstone the old entry when the shelved improvement weakly dominates
                              # its stored (robustness, metric) ranking; mixed trade-offs stay live
  [orchestrator.wall]         # THE WALL LEDGER: a depth-0 failure shelves its best champion as a
                              # below-bar stepping stone (dependency entry, never a false lookup hit),
                              # and later attempts on that signature warm-start from it. Assaults on a
                              # hard family (two_spirals) accumulate training + structure instead of
                              # restarting; one stone per lineage, replaced only on a strict win.
  ledger = true
  min_metric = 0.45           # a stone must carry SOME signal before it is worth keeping
  seed_top_k = 1              # stones grafted into the next attempt's starting population
  [orchestrator.direct]       # the phase-1 flat recipe on the task's REAL I/O: the structure-growing
                              # fallback (two-spirals class) and the source of task-shaped modules.
                              # TIME-axis tasks run through the stepped recurrent substrate here.
  pop_size = 64
  elitism = 2
  assess_workers = 12         # process-pool the per-genome decode+train+evaluate across cores (M4 Max
                              # has 12 performance cores); 0/1 = sequential. Bit-identical to serial
                              # (independent genomes, rng-free training); the dominant run cost.
    [orchestrator.direct.train]  # gradient_scheduled (gate-E remedy 1): linear warmup to `lr` then
                                 # cosine decay to 5% of it. This is the validated valley fix for the
                                 # two-spirals class: a seeded all-sin topology survives as champion at
                                 # 0.651 with all sin nodes intact vs dying at 0.604 under fixed lr.
                                 # `steps` is the PRIMARY knob here (gate-E fully validated at 600 on a
                                 # single seeded genome; 250 balances that against pop-64 x up-to-240-gen
                                 # cost with 12 workers). Raise it if the fit still plateaus mid-training.
                                 # gradient_scheduled has no batched form, so it always runs on the
                                 # assess pool; do NOT add a `batched` key (it is not an accepted param).
                                 # This REPLACES gradient_refine, so refine_steps>1 genomes train on a
                                 # final-pass loss instead of per-pass deep supervision on this path.
                                 # Peak lr 0.01 matches the gate-E gradient_scheduled validation regime
                                 # exactly (the valley fix was measured at 0.01, not the base fixed-lr 0.03).
    kind = "gradient_scheduled"
    steps = 250
    lr = 0.01
    writeback = true
    weight_decay = 0.0002

[library]                     # admission policy: what earns a place on the shelf
admission = "archive"         # open-ended QD archive: keep BEHAVIORALLY DIVERSE stepping stones, not
                              # just the top-k by metric ("default" = flat cap; "accept_all" = legacy)
gc = true                     # run-end sweep of unreferenced tombstones (mark-and-sweep from live
                              # entries; resumable state protected; dead router vertices pruned)
min_metric = 0.9              # quality floor on the accept metric
min_robustness = 0.0          # weight-robustness floor (raise once the library is healthy)
per_niche_cap = 2             # max entries per (io shape, behavior niche): distinct KINDS of solution
                              # coexist (small/deep, recurrent/refining, gated, macro) for recombination
max_per_signature = 12        # total live entries per io shape across all niches; the weakest is
                              # tombstoned (never deleted) when full, so existing refs keep assembling

[substrate]
available_activations = ["tanh", "relu", "sigmoid", "identity", "sin", "gaussian"]  # sin/gaussian: periodic + radial primitives (Phase 0.2)
default_activation = "tanh"
recurrent = true              # permits recurrent genes (inert under the flat decode; the stepped
                              # substrate uses them on TIME-axis subtask evolution)

[evolution]
loop = "hierarchical"
pop_size = 64                 # module population fallback (overridden by [evolution.modules].pop_size)
elitism = 1
  [evolution.init]              # cppn generative seed, SEEDED WITH sin/gaussian hidden activations:
                                # each member's random pair-query generator compiles into a sparse
                                # starting wiring whose hidden nodes carry periodic/radial primitives
                                # directly. This is the sharpest lever at the gate-E representation
                                # wall (evolution never introduced a single sin node on its own), and
                                # it also gives the population structural diversity from generation
                                # zero. `hidden` is larger than the main config's because two-spirals
                                # genuinely wants capacity (gate E: H=64 detector banks reached 1.000).
  kind = "cppn"
  weight_scale = 1.0
  hidden = 16                 # hidden nodes per generated seed (a bank of periodic detectors to grow from)
  density = 0.8               # HIGH on purpose: cppn emits round(n_inputs * hidden * density) input->hidden
                              # edges, and two-spirals has only 2 inputs, so at 0.3 most seeded hidden nodes
                              # would receive NO data edge -> sin/gaussian of a bias constant is a dead
                              # constant detector. 0.8 gives ~26 input->hidden edges over 16 nodes, so most
                              # detectors actually SEE the inputs (the whole point of seeding them here).
  generator_hidden = 3        # width of each member's tiny pair-query generator MLP
  hidden_activations = ["sin", "gaussian", "tanh"]   # the seeded phenotype palette (NOTE: intentionally
                                                     # breaks the "sin/gaussian mutation-only" invariant
                                                     # -- that is the whole point of this arm)
  [evolution.selection]       # options: "tournament" (param: tournament_size) | "truncation" (fraction)
                              # | "nsga2" (Pareto rank + crowding tournament; needs [fitness] objectives,
                              # degrades to a fitness tournament on the scalar call sites)
  kind = "nsga2"              # G1+ arm: Pareto over [fitness] objectives (no params; tournament_size must stay dropped)
  [evolution.crossover]       # options: "none" (asexual; clone the fitter parent) | "neat" (innovation-aligned)
  kind = "neat"
  rate = 0.2
  [evolution.mutation]        # the MODULE population's operators (the proven phase-1 recipe plus
                              # the new primitives: product gating, recurrence, and library reuse:
                              # add_library_module inlines a found network as evolvable structure,
                              # add_macro_node embeds one as a single FROZEN unit, LSTM-cell style).
                              # With gradient training, evolution searches STRUCTURE and gradient
                              # owns the WEIGHTS: perturb_weights (registered) is omitted because it
                              # fights the optimizer; add_node (canonical NEAT single-edge split) is
                              # registered but slow to become useful next to add_rich_node/add_deep_node.
                              #
                              # SELF-ADAPTIVE RATES (lever F): each genome carries its own per-operator
                              # probabilities as strategy genes, perturbed log-normally and inherited by
                              # its children, so the operator mix retunes itself for the task instead of
                              # staying at the hand-set *_prob seeds below.
  self_adaptive = true
  self_adaptive_learning_rate = 0.1   # log-normal step size on the rates
  self_adaptive_min = 0.001           # rate clamp floor
  self_adaptive_max = 1.0             # rate clamp ceiling
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection", "mutate_activation", "mutate_aggregation", "add_recurrent_connection", "add_library_module", "add_macro_node", "tweak_refine_steps", "add_local_node", "add_local_connection", "add_shared_motif"]
  add_rich_node_prob = 0.12
  add_rich_node_fan_in = 4
  add_deep_node_prob = 0.12
  add_deep_node_fan_in = 4
  add_deep_node_fan_out = 2
  add_connection_prob = 0.12
  toggle_connection_prob = 0.05
  mutate_activation_prob = 0.06
  mutate_aggregation_prob = 0.05
  mutate_aggregation_max_fan_in = 4
  add_recurrent_connection_prob = 0.04
  add_library_module_prob = 0.05
  add_macro_node_prob = 0.05
  add_macro_node_max_outputs = 16
  tweak_refine_steps_prob = 0.06   # TRM lever: nudge per-genome refinement depth (paired with recurrence)
  tweak_refine_steps_max_steps = 6
  # Geometry operators: no-ops without coordinates (the flat/module path), but on grid tasks the
  # direct strategy stamps axis coordinates, so these grow LOCAL receptive fields and repeated
  # motifs (a structural convolution prior, untied weights) -- the lever for the high-dim image wall.
  add_local_node_prob = 0.1
  add_local_node_fan_in = 4
  add_local_connection_prob = 0.1
  add_local_connection_radius = 1.5
  add_shared_motif_prob = 0.05
  add_shared_motif_copies = 2
  [evolution.train]           # trains assembled compositions: glue + unfrozen live module copies.
                              # steps must tune a freshly-grown candidate enough for its capacity to
                              # show BEFORE it competes (champions are never re-trained); weight_decay
                              # is what makes fits GENERALIZE (closes the support->query gap). Left as
                              # plain gradient: the scheduled trainer's validated home is the direct path.
  kind = "gradient"
  steps = 40
  lr = 0.03
  writeback = true            # Lamarckian: tuned weights copy back into the genome (the hierarchical
                              # loop routes champion-only module writeback itself)
  weight_decay = 0.0002
  [evolution.evaluate]        # hybrid = trained metrics PLUS weight-robustness (library admission currency)
  kind = "hybrid"
  samples = [-2.0, -1.0, -0.5, 0.5, 1.0, 2.0]
  batched_samples = "auto"    # stack the 6 sample fills into one batched forward, but only where it
                              # measured a win (nodes >= 768: 1.04x at 784, 1.14x at 3072; a LOSS
                              # below that, T2 2026-07-04). false = always serial, true = always stacked.
  [evolution.novelty]         # DIVERGENT SELECTION: k-NN behavioral novelty over a per-task archive,
                              # computed by the direct path's post-assess hook and read by the
                              # "novelty" fitness component / Pareto objective. archive_cap = 0 is the
                              # archive-free (population-only) ablation.
  k = 15
  archive_cap = 256
  probe_rows = 64
  [evolution.speciation]      # module species are the blueprint targets the compositions reference.
                              # "neat" = compatibility-distance niching + fitness sharing, one champion
                              # per species; the threshold AUTO-ADJUSTS toward target_species each
                              # generation (a fixed threshold lets the population fracture into
                              # singletons; target_species = 0 disables the auto-adjust)
  kind = "neat"
  threshold = 1.5             # initial compatibility distance; auto-tuned from here
  target_species = 6
  threshold_adjust = 0.3      # step size for the auto-adjustment
  min_threshold = 0.3         # floor so the threshold never collapses to zero
  c_excess = 1.0              # weight on excess genes in the distance
  c_disjoint = 1.0            # weight on disjoint genes
  c_weight = 0.5              # weight on mean matching-connection weight difference

  [evolution.composition]     # the per-task composition population (level 2+)
  pop_size = 48
  elitism = 2
  max_inline_depth = 4
  glue_rank = 8               # NEW glue factorizes to rank 8 when in*out exceeds the threshold
  glue_rank_threshold = 4096  # (a width-784 dense edge is 614k floats; rank 8 is 12.5k)
  catalog_width_tolerance = -1  # -1 = expose every library entry to comp mutations (glue adapts)
    [evolution.composition.selection]
    kind = "tournament"
    tournament_size = 2
    [evolution.composition.crossover]
    kind = "comp_neat"
    rate = 0.3
    [evolution.composition.mutation]
    operators = ["add_module_node", "switch_ref", "add_comp_edge", "toggle_comp_edge", "perturb_glue"]
    add_module_node_prob = 0.3
    switch_ref_prob = 0.12
    add_comp_edge_prob = 0.15
    toggle_comp_edge_prob = 0.05
    perturb_glue_prob = 0.6
    perturb_glue_sigma = 0.3

  [evolution.modules]         # the shared live module population (level 1)
  pop_size = 64
  elitism = 1
  in_ports = 4
  out_ports = 2
  advance_every = 3           # module generations per composition generation
  writeback = "champion"      # only the best composition writes module weights back
  attribution = "max"         # a module is as good as the BEST composition using it
  decay = 0.95
  offspring_discount = 0.9
  seed_fraction = 0.25        # fraction of the module pool grafted from the library at run start
  absorb_top_k = 2            # at each lookup miss, graft up to this many NEW library entries over
                              # the worst non-champions: found structures join the soup mid-run

[fitness]
# Weighted sum of registered components, higher is better (the full menu lives in
# ardevo/evolution/fitness.py; weights bind as w_<name>). Bounded loss (0,1] instead of raw
# (-inf,0] so it no longer swamps accuracy and robustness; robustness weight raised because it is
# the library admission currency and the cross-task transfer signal. All components live on a
# comparable scale, so selection actually balances them.
components = ["bounded_negative_support_loss", "support_accuracy", "weight_robustness", "hidden_penalty", "complexity_penalty"]
w_bounded_negative_support_loss = 2.0
w_support_accuracy = 1.0
w_weight_robustness = 0.5
# FREE GROWTH (the validated two-spirals solve recipe): the penalties are ZEROED here on purpose.
# The direct path tracks its champion by this penalized SCALAR fitness (best = max(pop, key=fitness))
# and gates the solve on that champion's query accuracy, so a nonzero hidden/complexity penalty makes
# a ~23-hidden solving net (the measured solve size) score BELOW a tiny non-fitting net and the solve
# can never be recorded (this is why G0/G1 logged 0 solves). connection_cost lives only in `objectives`
# below (it shapes the Pareto front, not the scalar champion), so anti-bloat pressure is not lost
# outright. Keep the penalties ON in the broad main config where cross-rung anti-bloat is wanted.
w_hidden_penalty = 0.0
w_complexity_penalty = 0.0
# PARETO OBJECTIVES: dropped connection_cost for this arm. On 2-input two-spirals it reduces to
# -edge_count (no input/output coordinates to measure wiring length), which directly pressures away
# the periodic detector CAPACITY the cppn seed injects and this probe exists to grow. novelty
# (behavioral divergence) stays: it is pro-exploration on the deceptive spiral landscape.
objectives = ["support_accuracy", "novelty"]
