extends = "canary.toml"

# Flagship cluster methodology: twenty tasks from every rung for each of three cold-library seeds.
# Jobs are resumable across 48-hour allocations and archive every durable task boundary.

[campaign]
seeds = [0, 1, 2]
cold_library = true

[run]
experiment = "orchestrated_overmind_full_cluster"
machine = "ClusterCUDA"

[schedule]
tasks_per_rung = 20

[orchestrator]
tasks = 360
max_task_seconds = 7200
max_total_task_seconds = 21600
decompose_first_above = "adaptive"

  [orchestrator.budgets]
  depth0 = 2000
  depth1 = 1000
  depth2 = 500
  depth3 = 250
  depth4 = 125
  depth5 = 62
  depth6 = 31
  depth7 = 15
  depth8 = 7

  [orchestrator.routed]
  distill_max_nodes = 16

  [orchestrator.direct]
  max_flat_outputs = "adaptive"
  max_init_genes = "adaptive"

    [orchestrator.direct.train]
    batched = true
    min_batch_nodes = 768
    max_padded_nodes = 8192
    microbatch_size = 0
    adaptive_microbatch = true

  [orchestrator.field]
  train_sites = 16384
  audit_sites = 65536
  verify_top_k = 8
  pop_size = 128

[library]
per_niche_cap = 4
max_per_signature = 48

# Adaptive limits use scheduler-visible host and device capacity instead of fixed tensor counts.
[resources]
mode = "adaptive"
host_fraction = 0.55
device_fraction = 0.70
host_reserve_gb = 8
device_reserve_gb = 2
tuple_bytes_per_value = 32
f32_bytes_per_value = 4
device_bytes_per_value = 20

[archive]
enabled = true
backend = "s3"
uri_env = "ARDEVO_ARCHIVE_URI"
snapshot_every_tasks = 1
retain_local_snapshots = 2
