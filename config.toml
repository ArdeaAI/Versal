# ArdEVO runtime configuration: the single source of truth for a run.
# Every evolutionary stage below is a registered, swappable operator. Change a `kind`, reorder
# `operators`, retune a weight, or register a new function and name it here. The loop never changes.

[run]
project = "ardevo"
experiment = "scaffolding_testing"
clearml = true               # true tracks in ClearML; false runs fully offline
machine = "MonadMetal"       # MonadMetal | MonadCPU | local -> local queue; LatticeCPU | LatticeCUDA -> remote
seed = 0
log_level = "INFO"           # INFO | DEBUG | WARNING
output_uri = false           # false keeps ClearML artifacts local; set a storage URI to upload them
repo = "https://github.com/ArdeaAI/ardevo.git"

  [run.duration]
  generations = 160          # the run also stops early if best query accuracy hits 1.0

[dataset]
source = "Ardea/Icarus-dataset"   # hyphen form is the live Hub id
rung = 2                          # which Icarus difficulty rung to evolve on (1 = XOR, 2 = parity, ...)
n_samples = 1000                  # cap on total examples per task (the parity.n4 pool is only 16)
support_fraction = 0.8            # support/query split for bucketed tasks; lower = more query points
                                  # (smoother fitness signal, less training data). Ignored for fixed-split
                                  # tasks like XOR. e.g. 0.5 gives an even split.

[substrate]
# Activations a hidden node may take (mutate_activation draws from this set). Outputs stay linear.
available_activations = ["tanh", "relu", "sigmoid", "identity"]
default_activation = "tanh"       # activation given to a freshly grown hidden node

[evolution]
pop_size = 64
elitism = 2                       # champions carried forward untouched (used when speciation = "none";
                                  # "neat" speciation keeps one champion PER species and ignores this)

  [evolution.init]
  # options: "minimal" (inputs + bias wired directly to outputs; grow structure from nothing)
  kind = "minimal"

  [evolution.selection]
  # options: "tournament" (param: tournament_size) | "truncation" (param: fraction)
  kind = "tournament"
  tournament_size = 3

  [evolution.crossover]
  # options: "none" (asexual; clone the fitter parent) | "neat" (innovation-aligned recombination)
  kind = "neat"
  rate = 0.3

  [evolution.mutation]
  # Ordered, independently swappable mutators. Available:
  #   add_rich_node     (params: add_rich_node_prob, add_rich_node_fan_in) -- new hidden node wired from
  #                       `fan_in` sources to ALL outputs; widens a layer (adds capacity immediately)
  #   add_deep_node     (params: add_deep_node_prob, add_deep_node_fan_in, add_deep_node_fan_out) -- new
  #                       hidden node that also feeds other hidden nodes, building DEPTH (needed for
  #                       tasks like two-spirals; width alone tops out)
  #   add_connection    (param:  add_connection_prob)
  #   toggle_connection (param:  toggle_connection_prob) -- enable/disable an edge; the only way to PRUNE,
  #                       so a complexity penalty can simplify (re-enabling is cycle-checked)
  #   add_node          (param:  add_node_prob)          -- canonical NEAT single-edge split (one-input
  #                       node; slow to become useful)
  #   mutate_activation (param:  mutate_activation_prob)
  #   perturb_weights   (params: perturb_weights_prob, perturb_weights_sigma) -- random weight noise.
  #                       Only for pure-NEAT (train="none"); with gradient training it FIGHTS the
  #                       optimizer (scrambles tuned weights each generation), so it is omitted here.
  # With gradient training, evolution searches STRUCTURE and gradient owns the WEIGHTS.
  operators = ["add_rich_node", "add_deep_node", "add_connection", "toggle_connection"]
  add_rich_node_prob = 0.14
  add_rich_node_fan_in = 6
  add_deep_node_prob = 0.16
  add_deep_node_fan_in = 6
  add_deep_node_fan_out = 3
  add_connection_prob = 0.18
  toggle_connection_prob = 0.06

  [evolution.train]
  # Per-candidate weight optimization before scoring. options:
  #   "none"     -- weights are purely co-evolved (pair with perturb_weights; classic NEAT)
  #   "gradient" -- backprop on the support set (params: steps, lr, writeback); future: "cmaes" (evosax)
  # steps must be high enough to tune a freshly-grown candidate so its capacity shows BEFORE it
  # competes (champions are not re-trained across generations, so this is its one shot). Training also
  # accumulates across a surviving lineage, so harder tasks (two-spirals) want more steps AND more gens.
  kind = "gradient"
  steps = 150
  lr = 0.03
  writeback = true            # Lamarckian: copy tuned weights back into the genome
  weight_decay = 0.0          # L2 regularization; raise (e.g. 2e-4) to make fits GENERALIZE (closes the
                              # support->query gap). Crucial on real generalization tasks like two-spirals.

  [evolution.speciation]
  # Protects new structure by making genomes compete mostly within their own niche. options:
  #   "none" -- one global population (uses [evolution].elitism)
  #   "neat" -- compatibility-distance niching + fitness sharing; one champion per species.
  # The threshold AUTO-ADJUSTS toward `target_species` each generation (a fixed threshold lets the
  # population fracture into singletons, which starves reproduction). `threshold` is just the start.
  # Set target_species = 0 to disable auto-adjust and hold `threshold` fixed.
  kind = "neat"
  threshold = 1.5            # initial compatibility distance; auto-tuned from here
  target_species = 12        # aim for ~this many species (keeps a healthy offspring budget)
  threshold_adjust = 0.3     # step size for the auto-adjustment
  min_threshold = 0.3        # floor so the threshold never collapses to zero
  c_excess = 1.0             # weight on excess genes in the distance
  c_disjoint = 1.0           # weight on disjoint genes
  c_weight = 0.5             # weight on mean matching-connection weight difference

[fitness]
# Weighted sum of registered components (higher is better). Available:
#   support_accuracy     (weight w_support_accuracy)     -- training-set fit; structure (hidden nodes)
#                          improves this, so it drives topology growth. Use it on data-starved tasks
#                          where the held-out query cannot generalize (e.g. parity.n4 has 16 examples).
#   negative_support_loss(weight w_negative_support_loss)-- smoother (continuous) version of the above
#   query_accuracy       (weight w_query_accuracy)        -- held-out generalization (the real goal when
#                          a task has enough data to generalize)
#   complexity_penalty   (weight w_complexity_penalty)    -- penalizes enabled edges + hidden nodes
#   negative_query_loss  (weight w_negative_query_loss)   -- continuous version of query accuracy
#
# NOTE on parity.n4.b0: it has only 16 examples, so the held-out query CANNOT generalize -- query_acc
# is essentially fixed noise (e.g. 2/3 of 3 points), and rewarding query LOSS actively fights structure
# because a hidden net must overfit the 13 support points (its query loss then balloons). So here we
# drive growth with support fit and prune with a modest complexity penalty. To study generalization,
# move to a data-rich rung/task where the query split is large enough to mean something.
components = ["support_accuracy", "query_accuracy", "complexity_penalty"]
w_support_accuracy = 0.6
w_query_accuracy = 0.4
w_complexity_penalty = 0.02
