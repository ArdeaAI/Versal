[project]
name = "ardevo"
version = "0.1.0"
description = "Playground for evolution experimentation"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "rich",
]

[project.scripts]
app = "ardevo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ardevo"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# unresolved-attribute = "ignore"  # mixin self-refs + dict/tensor/getattr dynamics
