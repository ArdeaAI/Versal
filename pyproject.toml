[project]
name = "ardevo"
version = "0.1.0"
description = "Playground for evolution experimentation"
authors = [{ name = "John Gardner (Sinjhin)", email = "john@ardea.io" }]
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "clearml>=1.16",
    "datasets>=5.0.0",
    "matplotlib>=3.9",
    "psutil>=6.0",
    "rich",
    "torch>=2.12.0",
]

[project.scripts]
app = "ardevo.main:main"
rung_doctor = "ardevo.tools.rung_doctor:main"
render = "ardevo.tools.net_gallery:main"
benchmark = "ardevo.tools.bench_throughput:main"
library_gc = "ardevo.tools.library_gc:main"
motif_census = "ardevo.tools.motif_census:main"
cppn_spike = "ardevo.tools.cppn_spike:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ardevo"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 180
target-version = "py312"
# Vendored, generated single-file runtime; edit upstream in the Icarus-Dataset repo, not here.
extend-exclude = ["ardevo/dataset/icarus.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# unresolved-attribute = "ignore"  # mixin self-refs + dict/tensor/getattr dynamics
