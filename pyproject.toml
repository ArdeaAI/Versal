[project]
name = "versal"
version = "0.1.0"
description = "Playground for evolution experimentation"
authors = [{ name = "John Gardner (Sinjhin)", email = "john@ardea.io" }]
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3",
    "clearml>=1.16",
    "datashader>=0.19.1",
    "datasets>=5.0.0",
    "huggingface-hub>=1.0",
    "matplotlib>=3.9",
    "networkx>=3.6",
    "psutil>=6.0",
    "rich",
    "torch>=2.12.0",
]

[project.scripts]
app = "versal.main:main"
run_report = "versal.tools.run_report:main"
rung_doctor = "versal.tools.rung_doctor:main"
render = "versal.tools.net_gallery:main"
benchmark = "versal.tools.bench_throughput:main"
library_gc = "versal.tools.library_gc:main"
motif_census = "versal.tools.motif_census:main"
cppn_spike = "versal.tools.cppn_spike:main"
run_matrix = "versal.tools.run_matrix:main"
ablation_suite = "versal.tools.ablation_suite:main"
experiment_archive = "versal.tools.experiment_archive:main"
router_migrate = "versal.tools.router_migrate:main"
runtime_inventory = "versal.tools.runtime_inventory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["versal"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 180
target-version = "py312"
# Vendored, generated single-file runtime; edit upstream in the Icarus-Dataset repo, not here.
extend-exclude = ["versal/dataset/icarus.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# unresolved-attribute = "ignore"  # mixin self-refs + dict/tensor/getattr dynamics
